# ============================================================
#  SearXNG — settings.yml
#  Optimized for AI Use Cases (Hermes Agent, OpenWebUI, GPT-Researcher)
# ============================================================

use_default_settings:
  engines:
    remove:
      - torch
      - ahmia

general:
  debug: $DEBUG
  instance_name: "$SEARXNG_INSTANCE_NAME"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: true

server:
  secret_key: ""                        # Automatically set from env -> $SEARXNG_SECRET, leave empty
  limiter: $LIMITER_ENABLED
  image_proxy: true
  http_protocol_version: "1.1"
  method: "GET"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

# ============================================================
#  UI Settings
# ============================================================
ui:
  default_locale: "$LOCALE"
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  default_theme: simple
  theme_args:
    simple_style: dark

# ============================================================
#  SEARCH — Accepted formats
#  CRITICAL: JSON and RSS need to be active to work viable with
#  Hermes Agent, OpenWebUI, GPT-Researcher via API
# ============================================================
search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "auto"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 300        # 5 min — short for personal/residential use
    SearxEngineCaptcha: 300             # 5 min
    SearxEngineTooManyRequests: 300     # 5 min
    cf_SearxEngineCaptcha: 3600         # 1 h
    cf_SearxEngineAccessDenied: 300     # 5 min
    recaptcha_SearxEngineCaptcha: 3600  # 1 h
  formats:
    - html
    - json       # ← REQUIRED for Hermes + GPT-Researcher API calls
    - csv
    - rss        # ← REQUIRED for news aggregation

# ============================================================
#  ENGINES — Grouped by use-case
#
#  Categories for perplexity-like use-cases:
#    general    → web search
#    news       → news section
#    science    → academic search
#    social     → social media monitoring
#    finance    → financial data (via DuckDuckGo/Brave)
#    code       → code search (GitHub, StackOverflow)
#    it         → general IT search (StackExchange sites, GitHub)
# ============================================================
engines:
    # ---------- GENERAL / WEB SEARCH ONLY ----------
  - name: google
    engine: google
    shortcut: g
    categories: [general, web]
    weight: 2

  - name: brave
    engine: brave
    shortcut: br
    categories: [general, web]
    brave_category: search
    weight: 2

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    categories: [general, web]
    weight: 1

  - name: bing                      # ← added
    engine: bing
    shortcut: b
    categories: [general, web]
    weight: 1
    # disabled: false  → keep ENABLED; remove the disabled flag from your original [3]

  - name: qwant                     # ← added
    engine: qwant
    shortcut: qw
    categories: [general, web]
    qwant_category: web
    weight: 1
  
  - name: startpage
    engine: startpage
    shortcut: sp
    categories: [general, web]
    weight: 1

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    categories: [general]
    weight: 2
    language: "auto"

# ============================================================
#  OUTGOING — HTTP client settings / limits
# ============================================================
outgoing:
  request_timeout: 10.0
  max_request_timeout: 30.0
  enable_http2: true
  retries: 1
  retry_on_http_error: true
  using_tor_proxy: false
  pool_connections: 1      # cap concurrent connections to each engine
  pool_maxsize: 1

botdetection:
  ip_limit:
    link_token: 1
    ipv4_link_token: 2
    ipv4_burst: 2
    ipv6_link_token: 2
    ipv6_burst: 2

# ============================================================
#  Redis / Valkey instance for caching / rate limiting etc.
# ============================================================
valkey:
  url: redis://datastore-memory:6379/0
