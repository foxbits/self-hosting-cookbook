services:
  apprise-notify:
    image: caronc/apprise:latest
    container_name: apprise-notify
    restart: unless-stopped
    networks:
      - home-lab-net
    ports:
      - "9862:8000"
    env_file:
      - .env
    volumes:
      - ./apprise_config:/config
      - ./apprise_attach:/attach
    healthcheck:
      # Per https://appriseit.com/api/deployment/
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  home-lab-net:
    external: true
