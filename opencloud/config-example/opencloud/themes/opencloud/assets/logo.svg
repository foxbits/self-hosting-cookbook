<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 72" role="img" aria-label="fox cloud">
  <title>🦊⛅ fox cloud</title>
  <defs>
    <linearGradient id="foxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4169E1"/>
      <stop offset="1" stop-color="#1B2A4E"/>
    </linearGradient>
  </defs>

  <!-- Fox-cloud mark: stylized cloud with two fox ears poking out the top -->
  <g transform="translate(8,12)">
    <!-- fox ears -->
    <polygon points="14,12 22,0 30,12" fill="#4169E1"/>
    <polygon points="30,12 38,2 44,14" fill="#1B2A4E"/>
    <!-- cloud body -->
    <path d="M10,32
             a14,14 0 0 1 14,-14
             a18,18 0 0 1 34,4
             a12,12 0 0 1 4,24
             H14
             a12,12 0 0 1 -4,-14 z"
          fill="url(#foxGrad)"/>
    <!-- fox face hint: two eyes + nose -->
    <circle cx="24" cy="28" r="2" fill="#FFFFFF"/>
    <circle cx="42" cy="28" r="2" fill="#FFFFFF"/>
    <polygon points="30,34 36,34 33,38" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
     font-weight="700" letter-spacing="0.5">
    <text x="92" y="38" font-size="28" fill="#1B2A4E">fox</text>
    <text x="138" y="38" font-size="28" fill="#4169E1">cloud</text>
    <text x="92" y="58" font-size="11" font-weight="500" fill="#56627A" letter-spacing="2">
      my data, my cloud
    </text>
  </g>
</svg>
