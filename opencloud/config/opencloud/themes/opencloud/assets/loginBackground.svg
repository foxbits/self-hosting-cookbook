<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="fox cloud background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A4E"/>
      <stop offset="0.55" stop-color="#2848A8"/>
      <stop offset="1" stop-color="#4169E1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#9DB4FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9DB4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cloudB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Soft cloud silhouettes -->
  <g opacity="0.85">
    <path d="M120,820
             a90,90 0 0 1 90,-90
             a120,120 0 0 1 230,30
             a80,80 0 0 1 30,150
             H150
             a80,80 0 0 1 -30,-90 z"
          fill="url(#cloudA)"/>
    <path d="M1380,260
             a80,80 0 0 1 80,-80
             a110,110 0 0 1 210,25
             a72,72 0 0 1 25,135
             H1405
             a72,72 0 0 1 -25,-80 z"
          fill="url(#cloudB)"/>
    <path d="M1450,860
             a60,60 0 0 1 60,-60
             a80,80 0 0 1 155,18
             a52,52 0 0 1 20,100
             H1470
             a52,52 0 0 1 -20,-58 z"
          fill="url(#cloudB)"/>
  </g>
</svg>
