services:
  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks:
      - home-lab-net
    ports:
      - "9704:8080"
    volumes:
      - ./searxng/core-config:/etc/searxng:rw
      - searxng-data:/var/cache/searxng
    env_file:
      - .env
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    ports:
      - "9705:11235"
    env_file:
      - .env
    shm_size: '3g' # agents count x parallel tabs x 150MB
    mem_limit: 4g
    mem_reservation: 1g
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - home-lab-net
  open-crawl:
    build:
      context: ${OPENCRAWL_PATH}
      dockerfile: Dockerfile
    container_name: open-crawl
    restart: unless-stopped
    networks:
      - home-lab-net
    ports:
      - "9708:8080"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  gpt-researcher:
    build:
      context: ${GPT_RESEARCHER_PATH}
      dockerfile: Dockerfile
    container_name: gpt-researcher
    restart: unless-stopped
    networks:
      - home-lab-net
    ports:
      - "9706:8000"
    volumes:
      - gpt-researcher-data:/usr/src/app/outputs:rw
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  camofox:
    build:
      context: ${CAMOFOX_BROWSER_PATH}
      dockerfile: Dockerfile.ci
      args:
        CAMOUFOX_VERSION: ${CAMOUFOX_VERSION}
        CAMOUFOX_RELEASE: ${CAMOUFOX_RELEASE}
    container_name: camofox
    restart: unless-stopped
    networks:
      - home-lab-net
    ports:
      - "9709:9377"
    env_file:
      - .env
    volumes:
      - camofox-profiles:/data/profiles
      - camofox-traces:/data/traces
      - ./camofox/cookies:/data/cookies:ro
      - ./camofox/uploads:/data/uploads
    init: true
    shm_size: '3g' # Firefox needs shared memory; 3g fits ~18 parallel tabs x 150MB
    mem_limit: 4g
    mem_reservation: 1g
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9377/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  crw:
    build:
      context: ${CRW_PATH}
      dockerfile: Dockerfile
      args:
        CARGO_PKGS: "-p crw-server --features camoufox"
    container_name: crw
    restart: unless-stopped
    networks: [home-lab-net]
    ports: ["9710:3000"]
    env_file: [.env]
    environment:
      CRW_CONFIG: config.crw
      CRW_RENDERER__CAMOUFOX__API_KEY: ${CAMOFOX_ACCESS_KEY}
      CRW_AUTH__API_KEYS: ${CRW_API_KEY}
    volumes: ["./crw/config.crw.toml:/app/config.crw.toml:ro"]
    depends_on:
      searxng: {condition: service_healthy}
      camofox: {condition: service_healthy}
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  searxng-data:
    driver: local
  gpt-researcher-data:
    driver: local
  camofox-profiles:
    driver: local
  camofox-traces:
    driver: local

networks:
  home-lab-net:
    external: true
